name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ts:back
      - run: npm run test:ts:front
      # Unit tests only: the integration suite has its own job and is skipped here
      # when OpenSearch is not reachable.
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - name: Check the package contents
        run: npm pack --dry-run

  integration:
    name: Integration tests (OpenSearch 3.9)
    runs-on: ubuntu-latest
    env:
      OPENSEARCH_TEST_NODE: https://localhost:9200
      OPENSEARCH_TEST_USER: admin
      OPENSEARCH_TEST_PASSWORD: Ci-Only-Passw0rd!
      # The OpenSearch demo certificate is self-signed.
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    services:
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: Ci-Only-Passw0rd!
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sk -u admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
