# Local OpenSearch for plugin development.
# Usage: cp dev/.env.example dev/.env && docker compose -f dev/docker-compose.yml up -d
name: strapi-plugin-opensearch-dev

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set it in dev/.env}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - '9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  # Optional: docker compose -f dev/docker-compose.yml --profile dashboards up -d
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    profiles: [dashboards]
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
    ports:
      - '5601:5601'
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
